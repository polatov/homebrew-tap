# Audits the cask and installs it on a clean macOS runner.
name: Test cask

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  install:
    runs-on: macos-latest
    env:
      # brew audit queries the GitHub API; unauthenticated calls from shared runners hit
      # the 60-per-hour limit.
      HOMEBREW_GITHUB_API_TOKEN: ${{ github.token }}
    steps:
      - name: Tap this repository
        run: brew tap polatov/tap "https://github.com/${GITHUB_REPOSITORY}"

      - name: Audit
        run: brew audit --cask --online polatov/tap/likenotepad

      - name: Install
        run: brew install --cask polatov/tap/likenotepad

      - name: Check the installed app
        run: |
          app="/Applications/LikeNotepad.exe.app"
          test -d "$app"
          lipo -archs "$app/Contents/MacOS/notepad-mac"
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$app/Contents/Info.plist"

      - name: Uninstall
        run: brew uninstall --cask --zap polatov/tap/likenotepad && test ! -d /Applications/LikeNotepad.exe.app
