# Keeps Casks/likenotepad.rb on the latest release of polatov/likenotepad.
name: Update cask

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Point the cask at the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/polatov/likenotepad/releases/latest --jq .tag_name)
          version=${tag#v}
          current=$(sed -n 's/^  version "\(.*\)"$/\1/p' Casks/likenotepad.rb)
          if [ "$version" = "$current" ]; then echo "up to date: $current"; exit 0; fi
          url="https://github.com/polatov/likenotepad/releases/download/$tag/LikeNotepad.exe_${version}_universal.dmg"
          sha=$(curl -fsSL "$url" | sha256sum | cut -d' ' -f1)
          sed -i "s/^  version \".*\"$/  version \"$version\"/; s/^  sha256 \".*\"$/  sha256 \"$sha\"/" Casks/likenotepad.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "likenotepad $version"
          git push
